name: Verify cPanel static package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - '.github/workflows/verify-cpanel.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run deploy:cpanel
      - name: Archive integrity check
        run: |
          unzip -t tetra-cpanel-ready.zip
          unzip -Z -1 tetra-cpanel-ready.zip | grep -Fx index.html
      - uses: actions/upload-artifact@v4
        with:
          name: tetra-cpanel-ready
          path: tetra-cpanel-ready.zip
          if-no-files-found: error
